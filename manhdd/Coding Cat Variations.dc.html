<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#100e16;}
  .cat{transform-box:fill-box;transform-origin:center bottom;animation:cc-bob 2.4s ease-in-out infinite;}
  .earL{transform-box:fill-box;transform-origin:bottom right;animation:cc-ear 5s ease-in-out infinite;}
  .earR{transform-box:fill-box;transform-origin:bottom left;animation:cc-ear 5s ease-in-out .7s infinite;}
  .eyes{transform-box:fill-box;transform-origin:center;animation:cc-blink 4.8s ease-in-out infinite;}
  .tail{transform-box:fill-box;transform-origin:6px 232px;animation:cc-tail 3s ease-in-out infinite;}
  .pawA{transform-box:fill-box;transform-origin:center;animation:cc-pawA 1s ease-in-out infinite;}
  .pawB{transform-box:fill-box;transform-origin:center;animation:cc-pawB 1s ease-in-out infinite;}
  .steam{transform-box:fill-box;transform-origin:bottom;animation:cc-steam 3.2s ease-in-out infinite;}
  .leaf{transform-box:fill-box;transform-origin:bottom center;animation:cc-leaf 4.5s ease-in-out infinite;}
  .glow{animation:cc-glow 2.8s ease-in-out infinite;}
  .note{transform-box:fill-box;transform-origin:center;animation:cc-note 4.2s ease-in-out infinite;}
  .bat{transform-box:fill-box;animation:cc-bat 1.1s ease-in-out infinite;}
  .wave{transform-box:fill-box;animation:cc-wave 2.6s ease-in-out infinite;}
  .spark{animation:cc-spark 1.6s ease-in-out infinite;}
  .twinkle{animation:cc-twinkle 2.2s ease-in-out infinite;}
  @keyframes cc-bob{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-6px) rotate(1deg);}}
  @keyframes cc-ear{0%,88%,100%{transform:rotate(0);}94%{transform:rotate(-10deg);}}
  @keyframes cc-blink{0%,92%,100%{transform:scaleY(1);}96%{transform:scaleY(.08);}}
  @keyframes cc-tail{0%,100%{transform:rotate(10deg);}50%{transform:rotate(-16deg);}}
  @keyframes cc-pawA{0%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
  @keyframes cc-pawB{0%,30%,100%{transform:translateY(0);}62%{transform:translateY(-5px);}}
  @keyframes cc-steam{0%{transform:translateY(0) scaleX(1);opacity:0;}25%{opacity:.55;}100%{transform:translateY(-26px) scaleX(1.5);opacity:0;}}
  @keyframes cc-note{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0;}15%{opacity:.9;}100%{transform:translateY(-46px) translateX(10px) rotate(14deg);opacity:0;}}
  @keyframes cc-glow{0%,100%{opacity:.32;}50%{opacity:.6;}}
  @keyframes cc-leaf{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  @keyframes cc-bat{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(-26deg);}}
  @keyframes cc-wave{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(5deg);}}
  @keyframes cc-spark{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:1;transform:scale(1);}}
  @keyframes cc-twinkle{0%,100%{opacity:.3;}50%{opacity:1;}}
</style>
